<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Зворотній зв'язок MindCare: залиште питання чи відгук — відповімо на e-mail протягом одного робочого дня.">
    <title>Зворотній зв'язок | MindCare</title>
    <link rel="icon" href="img/logo.svg" type="image/svg+xml">
    <!-- ЛР5: normalize.css вирівнює стилі за замовчуванням у різних браузерах -->
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/dynamic.css">
    <script src="js/feedback-tooltip.js" defer></script>
    <script src="js/feedback-form.js" defer></script>
    <!-- Внутрішня таблиця стилів: сторінка «Зворотній зв'язок» побудована на Flexbox -->
    <style>
        /* ===== Сторінка — flex-контейнер у стовпчик ===== */
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ===== Шапка — flex-контейнер у рядок ===== */
        header {
            display: flex;
            flex-flow: row wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1rem 1.5rem;
            padding: 1rem 2.5rem;
        }
        header img {
            width: 4rem;
            height: 4rem;
        }
        header h1 {
            flex-grow: 1;                 /* назва забирає вільне місце */
            font-size: 1.8rem;
        }

        /* ===== Основна частина ===== */
        main {
            flex: 1 0 auto;               /* розтягується, щоб підвал був унизу */
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 3rem 1.5rem;
        }
        main > h2 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        main > p {
            margin: 0 0 1.75rem;
            max-width: 38.75rem;
            text-align: center;
        }

        /* ===== Форма — flex-контейнер з перенесенням рядків ===== */
        form {
            display: flex;
            flex-flow: row wrap;
            justify-content: space-between;
            align-items: stretch;
            align-content: flex-start;
            gap: 1.5rem;
            width: min(60rem, 100%);
            padding: 2.25rem 2.5rem;
            background-color: var(--card);
            border-radius: var(--radius-organic);
            box-shadow: 0 10px 30px rgba(47, 74, 58, 0.08);
        }

        /* «Персональна інформація» — ліва колонка */
        fieldset {
            order: 1;
            flex: 1 1 20rem;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            margin: 0;
            padding: 1.25rem 1.5rem 0.5rem;
            border: 2px solid var(--sage);
            border-radius: 24px 8px 24px 8px;
        }
        legend {
            padding: 0 0.625rem;
            font-family: "Lora", Georgia, serif;
            font-weight: 700;
            color: var(--forest);
        }

        /* Поле: підпис над елементом керування */
        .field {
            display: flex;
            flex-direction: column;
            gap: 0.375rem;
            margin: 0 0 0.75rem;
        }
        .field label {
            font-weight: 700;
            color: var(--forest);
        }

        /* «Мета» і «Детально» — права колонка */
        .field-purpose {
            order: 2;
            flex: 1 1 17.5rem;
            align-self: flex-start;
        }
        .field-details {
            order: 3;
            flex: 2 1 100%;
        }

        /* Згода і кнопки — нижній рядок */
        .field-consent {
            order: 4;
            flex: 1 1 auto;
            display: flex;
            align-items: center;
            gap: 0.625rem;
            margin: 0;
        }
        .form-actions {
            order: 5;
            flex: 0 0 auto;               /* кнопки не стискаються */
            align-self: center;
            display: flex;
            gap: 0.75rem;
            margin: 0;
        }

        /* Елементи керування */
        input,
        select,
        textarea {
            font: inherit;
            padding: 0.625rem 0.875rem;
            border: 2px solid #d8d2c4;
            border-radius: 14px;
            background-color: white;
            transition: border-color 0.25s, box-shadow 0.25s;
        }
        textarea {
            resize: vertical;
            max-width: 100%;
        }
        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--sage);
            box-shadow: 0 0 0 4px hsla(138, 24%, 57%, 0.25);
        }
        /* Селектор атрибута: заповнене, але неправильне поле */
        input[type="email"]:not(:-ms-input-placeholder):invalid, input[type="number"]:not(:-ms-input-placeholder):invalid {
            border-color: firebrick;
        }
        input[type="email"]:not(:placeholder-shown):invalid,
        input[type="number"]:not(:placeholder-shown):invalid {
            border-color: firebrick;
        }
        input[type="checkbox"] {
            width: 1.25rem;
            height: 1.25rem;
            accent-color: var(--forest);
        }

        footer {
            text-align: center;
        }

        @media (max-width: 700px) {
            header { padding: 0.75rem 1rem; }
            form   { padding: 1.5rem 1.25rem; }
            .form-actions { flex-grow: 1; justify-content: center; }
        }
    </style>
    <!-- ЛР5: медіазапити підключено останніми, щоб вони мали вищий пріоритет -->
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="page-feedback">

    <header>
        <img src="img/logo.svg" alt="Логотип MindCare" width="90" height="90">
        <h1>MindCare</h1>
        <nav>
            <ul>
                <li><a href="index.html">Головна</a></li>
                <li><a href="services.html">Послуги</a></li>
                <li><a href="feedback.html" aria-current="page">Зворотній зв'язок</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Зворотній зв'язок</h2>
        <p>Залиште повідомлення — ми відповімо на вказаний e-mail протягом одного робочого дня.</p>

        <form action="#" method="get">
            <fieldset>
                <legend>Персональна інформація</legend>

                <p class="field">
                    <label for="full-name">Прізвище та ім'я:</label>
                    <input type="text" id="full-name" name="full-name"
                           placeholder="Павленко Катерина" minlength="3" maxlength="60" required>
                </p>

                <p class="field">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email"
                           placeholder="name@example.com" required>
                </p>

                <p class="field">
                    <label for="age">Вік:</label>
                    <input type="number" id="age" name="age" min="16" max="100" placeholder="16–100" required>
                </p>
            </fieldset>

            <p class="field field-purpose">
                <label for="purpose">Мета зворотнього зв'язку:</label>
                <select id="purpose" name="purpose" required>
                    <option value="" selected disabled>— оберіть мету —</option>
                    <option value="cooperation">Співпраця</option>
                    <option value="quality-complaint">Скарга на якість послуги</option>
                    <option value="suggestion">Пропозиція</option>
                    <option value="site-error">Наявність помилки на сайті</option>
                </select>
            </p>

            <p class="field field-details">
                <label for="details">Детально:</label>
                <textarea id="details" name="details" rows="6" cols="50" maxlength="500"
                          placeholder="Опишіть ваше звернення (до 500 символів)"></textarea>
            </p>

            <p class="field-consent">
                <input type="checkbox" id="consent" name="consent" required>
                <label for="consent">Я даю згоду на обробку моїх персональних даних</label>
            </p>

            <p class="form-actions">
                <button type="submit">Надіслати</button>
                <button type="reset" onclick="return confirmReset()">Очистити форму</button>
            </p>
        </form>
    </main>

    <footer>
        <address>
            м. Київ, вул. Січових Стрільців, 21, офіс 305 |
            <a href="tel:+380441234567">+38 (044) 123-45-67</a>
        </address>
        <p><small>&copy; 2026 MindCare</small></p>
    </footer>

</body>
</html>
